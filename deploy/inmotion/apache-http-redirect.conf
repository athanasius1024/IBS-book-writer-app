# Apache include for the plain-HTTP virtual host of books.infodine.net (cPanel account "ibsbook").
# Install as:
#   /etc/apache2/conf.d/userdata/std/2_4/ibsbook/books.infodine.net/ibs-redirect.conf
# then run:  /scripts/ensure_vhost_includes --user=ibsbook && /scripts/restartsrv_httpd
# See DEPLOYMENT-INMOTION.md, step 8.
#
# Everything is sent to HTTPS except the /.well-known/ paths that AutoSSL uses to prove it owns the name.

RewriteEngine On
RewriteCond %{REQUEST_URI} !^/\.well-known/
RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
