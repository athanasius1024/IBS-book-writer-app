# Apache include for the HTTPS virtual host of books.infodine.net (cPanel account "ibsbook").
# Install as:
#   /etc/apache2/conf.d/userdata/ssl/2_4/ibsbook/books.infodine.net/ibs-proxy.conf
# then run:  /scripts/ensure_vhost_includes --user=ibsbook && /scripts/restartsrv_httpd
# See DEPLOYMENT-INMOTION.md, step 8.
#
# Needs these Apache modules: proxy, proxy_http, headers (check: httpd -M | grep -E 'proxy_http|headers').

ProxyRequests Off
ProxyPreserveHost On

# AutoSSL (certificate issue and renewal) must still reach Apache's own files.
ProxyPass /.well-known/ !

# Everything else goes to gunicorn. A large book can take a while to build, so allow it.
ProxyPass / http://127.0.0.1:8000/ timeout=190
ProxyPassReverse / http://127.0.0.1:8000/

# Tell the app the visitor used HTTPS (it then marks cookies Secure and builds https links).
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
