# /etc/nginx/sites-available/ibs-bookwriter  (symlink into sites-enabled)
#
# Replace books.example.com with your host name. Get the certificate first (this
# uses the default nginx site on port 80, before this file is enabled):
#   sudo certbot certonly --webroot -w /var/www/html -d books.example.com
# Renewals reuse the same webroot, which is why the port-80 block below serves
# /.well-known/acme-challenge/ instead of redirecting it.
# See DEPLOYMENT.md, part 2.

# The app has no login throttling of its own, so slow down password guessing
# here. ~10 requests/minute per client address, with a small burst.
limit_req_zone $binary_remote_addr zone=ibs_auth:10m rate=10r/m;

upstream ibs_bookwriter {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" on the listen line works on every nginx version (Ubuntu 24.04 ships
    # 1.24; the separate "http2 on;" directive needs 1.25.1 or newer).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name books.example.com;

    ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app caps uploads at 8 MB per request (MAX_CONTENT_LENGTH).
    client_max_body_size 10m;

    # PDF/EPUB builds can take a while; match gunicorn's timeout.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Flask-WTF checks the Referer against the Host on HTTPS, so Host must be
    # passed through unchanged. X-Forwarded-Proto makes the app see "https".
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        limit_req zone=ibs_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ibs_bookwriter;
    }

    location = /register {
        limit_req zone=ibs_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ibs_bookwriter;
    }

    # Static assets (CSS/JS/icons) can be cached by browsers.
    location /static/ {
        proxy_pass http://ibs_bookwriter;
        expires 7d;
    }

    location / {
        proxy_pass http://ibs_bookwriter;
    }
}
